# A pasta inteira já é a raiz do frontend agora (era frontend/ dentro do
# monólito) -- sem node/Postgres/Docker além do próprio Node, ~15-20s,
# igual ao check "frontend" que já existia no CI do monólito.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
