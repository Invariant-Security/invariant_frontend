<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Invariant transforma configuração de infraestrutura crítica em evidência auditável para ambientes híbridos e legados." />
    <!-- Google Fonts (Sora/DM Mono/Manrope) moved to Home.jsx -- only Home
         uses them, Demo.jsx uses system fonts, and loading them here meant
         /demo paid a ~200ms render-blocking request for fonts it never
         uses. React 19 hoists <link> rendered in JSX to <head>, and since
         Home is React.lazy()-loaded, the request now only fires when Home
         actually mounts. -->
    <title>Invariant — Evidência auditável para hardening</title>
    <!-- Inlined instead of imported from index.css: PageSpeed flagged the
         separate ~0.7KB request as render-blocking (~60ms) for content
         this small -- not worth a network round trip. Keep this in sync
         with src/index.css by hand if it ever changes (it's a minimal
         reset, hasn't changed since the project started). -->
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color-scheme: light dark; }
      #root { min-height: 100svh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
