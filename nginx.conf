server {
  listen 80;
  listen [::]:80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Vite content-hashes these filenames (index-CU2sQcbF.js), so a new
  # deploy always ships new URLs -- safe to cache aggressively, no
  # invalidation needed.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
