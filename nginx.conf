server {
  listen 80;
  listen [::]:80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Vite content-hashes these filenames (index-CU2sQcbF.js), so a new
  # deploy always ships new URLs -- safe to cache aggressively, no
  # invalidation needed.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Root-level static files (logo.svg, favicon.svg, robots.txt, ...) --
  # unlike /assets/, these keep the same filename across deploys, so no
  # `immutable`: a moderate TTL that still lets a real content change show
  # up within a day instead of caching forever.
  location ~* \.(?:svg|ico|png|jpg|jpeg|webp|txt|xml)$ {
    expires 1d;
    add_header Cache-Control "public";
  }
}
